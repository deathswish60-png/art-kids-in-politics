backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: /
display_url: /
logo_url: /

collections:
  - name: "content"
    label: "Website Content"
    files:
      - label: "Site Content"
        name: "site"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Podcast Settings"
            name: "show"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Links"
                name: "links"
                widget: "object"
                fields:
                  - { label: "Spotify", name: "spotify", widget: "string", required: false }
                  - { label: "Apple Podcasts", name: "apple", widget: "string", required: false }
                  - { label: "YouTube", name: "youtube", widget: "string", required: false }

          - label: "Topics"
            name: "topics"
            widget: "object"
            fields:
              - { label: "Art", name: "Art", widget: "string" }
              - { label: "Politics", name: "Politics", widget: "string" }
              - { label: "Youth", name: "Youth", widget: "string" }
              - { label: "Culture", name: "Culture", widget: "string" }
              - { label: "Society", name: "Society", widget: "string" }

          - label: "Hosts"
            name: "hosts"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Bio", name: "bio", widget: "text" }

          - label: "Episodes"
            name: "episodes"
            widget: "list"
            summary: "{{fields.n}} — {{fields.title}}"
            fields:
              - { label: "Episode Number", name: "n", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Use lowercase words separated by hyphens, e.g. my-new-episode" }
              - { label: "Short Title", name: "title", widget: "string" }
              - { label: "Full Title", name: "full", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "People / Hosts", name: "people", widget: "list" }
              - label: "Topics"
                name: "topics"
                widget: "select"
                multiple: true
                options: ["Art", "Politics", "Youth", "Culture", "Society"]
              - { label: "Listen Link", name: "listen", widget: "string", required: false }
              - { label: "Watch Link", name: "watch", widget: "string", required: false }
              - { label: "Audio URL", name: "audio", widget: "string", required: false }
              - label: "Transcript"
                name: "transcript"
                widget: "list"
                fields:
                  - { label: "Speaker", name: "speaker", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
